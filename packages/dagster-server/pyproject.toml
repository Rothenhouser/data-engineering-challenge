[project]
name = "ev-ocpp-server"
version = "0.1.0"
description = "Dagster host: webserver and daemon serving the ev-ocpp code location"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ev-ocpp-dagster",
    "dagster>=1.9",
    "dagster-webserver>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_ocpp_server"]
