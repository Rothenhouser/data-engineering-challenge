[project]
name = "ev-ocpp-analysis"
version = "0.1.0"
description = "OCPP parsing, session reconstruction, and DuckDB query layer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_ocpp_analysis"]
