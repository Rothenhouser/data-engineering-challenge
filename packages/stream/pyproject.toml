[project]
name = "ev-ocpp-stream"
version = "0.1.0"
description = "Standalone always-on OCPP stream consumer writing to the raw landing zone"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ev-ocpp-analysis",
    "psycopg[binary]>=3.2",
]

[project.scripts]
ev-ocpp-stream = "ev_ocpp_stream.consumer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_ocpp_stream"]
