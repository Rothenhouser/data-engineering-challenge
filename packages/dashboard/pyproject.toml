[project]
name = "ev-ocpp-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for EV charging session insights"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ev-ocpp-analysis",
    "streamlit>=1.40",
]

[project.scripts]
ev-ocpp-dashboard = "ev_ocpp_dashboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_ocpp_dashboard"]
