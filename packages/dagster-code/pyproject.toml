[project]
name = "ev-ocpp-dagster"
version = "0.1.0"
description = "Dagster code location: OCPP assets and definitions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ev-ocpp-analysis",
    "dagster>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_ocpp_dagster"]

[tool.dagster]
module_name = "ev_ocpp_dagster.definitions"
code_location_name = "ev_ocpp"
