[project]
name = "ev-ocpp-workspace"
version = "0.1.0"
description = "EV Coorp OCPP analytics prototype: Dagster + DuckDB + Parquet + Streamlit"
readme = "README.md"
requires-python = ">=3.14"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ev-ocpp-analysis = { workspace = true }
ev-ocpp-dagster = { workspace = true }
ev-ocpp-stream = { workspace = true }

[dependency-groups]
dev = [
    "poethepoet>=0.30",
    "pytest>=8.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["packages"]

[tool.poe.tasks]
sync = "uv sync --all-packages --all-groups"
lint = "ruff check packages"
fmt = "ruff format packages"
test = "pytest"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["**/notebooks/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FURB"]
