[project]
name = "ev-ocpp-workspace"
version = "0.1.0"
description = "EV Coorp OCPP analytics prototype: Dagster + DuckDB + Parquet + Streamlit"
readme = "README.md"
requires-python = ">=3.14"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ev-ocpp-analysis = { workspace = true }
ev-ocpp-dagster = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
