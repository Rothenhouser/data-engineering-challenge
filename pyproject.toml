[project]
name = "ev-ocpp-workspace"
version = "0.1.0"
description = "EV Coorp OCPP analytics prototype: Dagster + DuckDB + Parquet + Streamlit"
readme = "README.md"
requires-python = ">=3.14"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ev-ocpp-analysis = { workspace = true }
ev-ocpp-dagster = { workspace = true }
ev-ocpp-stream = { workspace = true }

[dependency-groups]
dev = [
    "poethepoet>=0.30",
    "pytest>=8.0",
    "ruff>=0.16.10",
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["packages"]

[tool.poe.tasks]
sync = "uv sync --all-packages --all-groups"
test = "pytest"
# Manual one-time DuckLake init: create the cold+gold catalog + data dir.
bootstrap = "python -m ev_ocpp_dagster.bootstrap"

# DESTRUCTIVE: wipe all local pipeline state, then re-bootstrap a clean slate.
# Drops the raw_events table + the ducklake_catalog DB in the containerized
# Postgres, removes the DuckLake Parquet data and local Dagster run storage,
# then runs `poe bootstrap` to recreate the catalog DB. Local dev only.
reset = ["_drop_raw_events", "_drop_catalog_db", "_rm_lake_data", "_rm_dagster_home", "bootstrap"]
_drop_raw_events = { shell = "wsl sudo docker compose -f deploy/docker-compose.yml exec -T postgres psql -U ocpp -d ocpp -c 'DROP TABLE IF EXISTS raw_events'" }
_drop_catalog_db = { shell = "wsl sudo docker compose -f deploy/docker-compose.yml exec -T postgres psql -U ocpp -d postgres -c 'DROP DATABASE IF EXISTS ducklake_catalog WITH (FORCE)'" }
_rm_lake_data = { shell = "rm -rf data/lake" }
_rm_dagster_home = { shell = "if [ -d dagster_home ]; then find dagster_home -mindepth 1 -not -name dagster.yaml -delete; fi" }

# Format first, then lint with autofix. `poe lint` runs both in order.
lint = ["_fmt", "_lint_fix"]
_fmt = "ruff format ."
_lint_fix = "ruff check --fix ."

# Run the dashboard locally with hot reload, against the containerized Postgres
# (needs `docker compose up postgres`, which publishes localhost:5432). The
# DuckLake catalog lives in the shared Postgres (ducklake_catalog DB; run
# `poe bootstrap` once); table data reads from ./data/lake/data. Reruns on save.
[tool.poe.tasks.dashboard]
cmd = "streamlit run packages/dashboard/src/ev_ocpp_dashboard/app.py --server.runOnSave=true"
[tool.poe.tasks.dashboard.env]
OCPP_PG_URI = { default = "postgresql://ocpp:ocpp@localhost:5432/ocpp" }
OCPP_LAKE_CATALOG = { default = "postgres:dbname=ducklake_catalog host=localhost user=ocpp password=ocpp" }
OCPP_LAKE_DATA = { default = "data/lake/data" }

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["**/notebooks/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FURB"]
